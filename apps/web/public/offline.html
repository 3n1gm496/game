<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MÉRIDIEN — la linea è caduta</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        background: radial-gradient(120% 80% at 50% 0%, #182740 0%, #0b1220 70%);
        color: #f2e9d8; font-family: "Iowan Old Style", Palatino, Georgia, serif;
        padding: 2rem; text-align: center;
      }
      main { max-width: 32rem; }
      h1 { font-size: 2rem; letter-spacing: .1em; text-transform: uppercase; margin: 0 0 .5rem; }
      p { color: #cdc2ae; line-height: 1.6; }
      .riga { width: 64px; height: 2px; background: #c9a227; margin: 1.5rem auto; }
      a {
        display: inline-block; margin-top: 1.5rem; padding: .8rem 1.6rem;
        border: 1px solid #c9a227; color: #f2e9d8; text-decoration: none;
        text-transform: uppercase; letter-spacing: .08em; font-size: .875rem;
        font-family: ui-sans-serif, -apple-system, sans-serif;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>La linea è caduta</h1>
      <div class="riga"></div>
      <p>
        La mareggiata ha portato via il cavo del telefono. Il Grand Hotel Méridien è ancora al suo
        posto: appena la connessione torna, la porta girevole ricomincia a girare.
      </p>
      <p>Le partite in corso ti aspettano: al rientro riprendi esattamente da dove eri.</p>
      <a href="/">Riprova</a>
    </main>
  </body>
</html>
